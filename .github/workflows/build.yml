name: Сборка SenioreM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Почта для кодов (из секретов)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python build/make_config.py

      - name: Сборка exe
        run: |
          pyinstaller build/SenioreM.spec --noconfirm --clean
          python build/slim.py dist/SenioreM

      - name: Зеркало моделей (голос и распознавание) в релизе «models»
        id: mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $r = Invoke-WebRequest -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/models" -Headers @{Authorization="Bearer $env:GH_TOKEN"} -SkipHttpErrorCheck
          if ($r.StatusCode -eq 200) { "exists=true" >> $env:GITHUB_OUTPUT; exit 0 }
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip" -OutFile models/vosk-model-small-ru-0.22.zip
          $hf = "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/ruslan/medium"
          Invoke-WebRequest "$hf/ru_RU-ruslan-medium.onnx" -OutFile models/ru_RU-ruslan-medium.onnx
          Invoke-WebRequest "$hf/ru_RU-ruslan-medium.onnx.json" -OutFile models/ru_RU-ruslan-medium.onnx.json
          "exists=false" >> $env:GITHUB_OUTPUT

      - name: Опубликовать зеркало моделей
        if: steps.mirror.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models
          name: Модели для SenioreM (зеркало)
          body: Речевая модель Vosk и голос Piper «Руслан». Программа скачивает их отсюда при первом запуске.
          prerelease: true
          make_latest: false
          files: |
            models/vosk-model-small-ru-0.22.zip
            models/ru_RU-ruslan-medium.onnx
            models/ru_RU-ruslan-medium.onnx.json

      - name: Самопроверка программы (голос и распознавание)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SenioreM\SenioreM.exe" -ArgumentList "--selftest","$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt | ForEach-Object { "$_" }
          Get-Content selftest.txt | Select-Object -Last 6 | ForEach-Object { Write-Output "::notice::$_" }
          if ($p.ExitCode -ne 0) { Write-Output "::error::Самопроверка не прошла"; exit 1 }

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Установщик
        shell: pwsh
        run: |
          $out = & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\SenioreM.iss 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { "$_" }
          if ($code -ne 0) {
            $out | Select-Object -Last 8 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
          Get-Item Output\SenioreM-Setup.exe | ForEach-Object { "Размер установщика: {0:N1} МБ" -f ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: SenioreM-Setup
          path: Output/SenioreM-Setup.exe

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SenioreM 1.0.${{ github.run_number }}
          make_latest: true
          files: Output/SenioreM-Setup.exe

name: Сборка SenioreM

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Почта для кодов (из секретов)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python build/make_config.py

      - name: Сборка exe
        run: |
          pyinstaller build/SenioreM.spec --noconfirm --clean
          python build/slim.py dist/SenioreM

      - name: Зеркало моделей в релизе «models» (докачиваем недостающие)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $have = @(gh release view models --json assets -q ".assets[].name" 2>$null)
          if ($LASTEXITCODE -ne 0) {
            gh release create models --prerelease --title "Модели для SenioreM (зеркало)" --notes "Речевая модель, голос и ИИ. Программа скачивает их отсюда."
            $have = @()
          }
          "в релизе уже есть: $($have -join ', ')"
          New-Item -ItemType Directory -Force models | Out-Null
          $hfv = "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/ruslan/medium"
          $want = [ordered]@{
            "vosk-model-small-ru-0.22.zip" = "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip"
            "ru_RU-ruslan-medium.onnx" = "$hfv/ru_RU-ruslan-medium.onnx"
            "ru_RU-ruslan-medium.onnx.json" = "$hfv/ru_RU-ruslan-medium.onnx.json"
            "whisper-small-config.json" = "https://huggingface.co/Systran/faster-whisper-small/resolve/main/config.json"
            "whisper-small-model.bin" = "https://huggingface.co/Systran/faster-whisper-small/resolve/main/model.bin"
            "whisper-small-tokenizer.json" = "https://huggingface.co/Systran/faster-whisper-small/resolve/main/tokenizer.json"
            "whisper-small-vocabulary.txt" = "https://huggingface.co/Systran/faster-whisper-small/resolve/main/vocabulary.txt"
            "Qwen2.5-1.5B-Instruct-Q4_K_M.gguf" = "https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"
            "Qwen2.5-3B-Instruct-Q4_K_M.gguf" = "https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
          }
          if (-not ($have -contains "llama-server-win-x64.zip")) {
            try {
              $rels = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=8" -Headers @{Authorization="Bearer $env:GH_TOKEN"}
            } catch { Write-Output "::error::llama.cpp api — $($_.Exception.Message)"; exit 1 }
            $pick = $null
            foreach ($rel in $rels) {
              $win = @($rel.assets | Where-Object { $_.name -match 'win' -and $_.name -match '\.zip$' })
              $cpu = $win | Where-Object { $_.name -match 'cpu' -and $_.name -match 'x64' } | Select-Object -First 1
              if (-not $cpu) {
                $cpu = $win | Where-Object { $_.name -match 'x64' -and $_.name -notmatch 'cuda|cudart|vulkan|hip|sycl|arm64|opencl|kompute|radeon' } | Select-Object -First 1
              }
              if ($cpu) { $pick = $cpu; "llama.cpp: $($rel.tag_name) -> $($cpu.name)"; break }
              else { "в $($rel.tag_name) нет подходящей сборки: $(($win | ForEach-Object name) -join ', ')" }
            }
            if (-not $pick) { Write-Output "::error::не нашёл сборку llama.cpp для Windows"; exit 1 }
            $want["llama-server-win-x64.zip"] = $pick.browser_download_url
          }
          $failed = $false
          foreach ($name in $want.Keys) {
            if ($have -contains $name) { "есть: $name"; continue }
            try {
              "качаю: $name"
              Invoke-WebRequest $want[$name] -OutFile "models/$name"
              "загружаю в релиз: $name ({0:N0} МБ)" -f ((Get-Item "models/$name").Length / 1MB)
              gh release upload models "models/$name" --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh upload exit $LASTEXITCODE" }
              Remove-Item "models/$name"
            } catch {
              Write-Output "::error::$name — $($_.Exception.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Самопроверка программы (голос, распознавание, ИИ)
        shell: pwsh
        env:
          SENIOREM_SELFTEST_AI: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $p = Start-Process -FilePath "dist\SenioreM\SenioreM.exe" -ArgumentList "--selftest","$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt | ForEach-Object { "$_" }
          Get-Content selftest.txt | Select-Object -Last 18 | ForEach-Object { Write-Output "::notice::$_" }
          gh release view ci-screens *> $null
          if ($LASTEXITCODE -ne 0) { gh release create ci-screens --prerelease --title "Снимки экранов сборки" --notes "Автоматические проверки." }
          gh release upload ci-screens selftest.txt --clobber
          $last = (Get-Content selftest.txt | Select-Object -Last 1)
          if ($last -ne "RESULT PASS") { Write-Output "::error::Самопроверка не прошла"; exit 1 }

      - name: Снимки экранов (проверка дизайна)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $p = Start-Process -FilePath "dist\SenioreM\SenioreM.exe" -ArgumentList "--uitest","$PWD\screens" -Wait -PassThru
          Get-Content screens\uitest.txt | ForEach-Object { "$_" }
          Get-Content screens\uitest.txt | Select-Object -Last 3 | ForEach-Object { Write-Output "::notice::ui: $_" }
          gh release view ci-screens *> $null
          if ($LASTEXITCODE -ne 0) { gh release create ci-screens --prerelease --title "Снимки экранов сборки" --notes "Автоматические снимки интерфейса для проверки." }
          Get-ChildItem screens\*.png, screens\uitest.txt | ForEach-Object { gh release upload ci-screens $_.FullName --clobber }
          $last = (Get-Content screens\uitest.txt | Select-Object -Last 1)
          if ($last -ne "OK") { Write-Output "::error::Проверка интерфейса не прошла"; exit 1 }

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Установщик
        shell: pwsh
        run: |
          $out = & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\SenioreM.iss 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { "$_" }
          if ($code -ne 0) {
            $out | Select-Object -Last 8 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
          Get-Item Output\SenioreM-Setup.exe | ForEach-Object { "Размер установщика: {0:N1} МБ" -f ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: SenioreM-Setup
          path: Output/SenioreM-Setup.exe

      - name: Релиз
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SenioreM 1.0.${{ github.run_number }}
          make_latest: true
          files: Output/SenioreM-Setup.exe

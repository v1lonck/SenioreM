name: Сборка SenioreM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Почта для кодов (из секретов)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python build/make_config.py

      - name: Сборка exe
        run: |
          pyinstaller build/SenioreM.spec --noconfirm --clean
          python build/slim.py dist/SenioreM

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Установщик
        shell: pwsh
        run: |
          $env:APP_VERSION = "1.0.${{ github.run_number }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\SenioreM.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item Output\SenioreM-Setup.exe | ForEach-Object { "Размер установщика: {0:N1} МБ" -f ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: SenioreM-Setup
          path: Output/SenioreM-Setup.exe

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SenioreM 1.0.${{ github.run_number }}
          make_latest: true
          files: Output/SenioreM-Setup.exe
